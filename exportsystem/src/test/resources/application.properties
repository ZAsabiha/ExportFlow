spring.application.name=exportsystem-test

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy values so beans that @Value-inject these (ContactServiceImpl, EmailServiceImpl)
# can be constructed in tests; no mail is actually sent against H2/test context.
app.mail.contact-to=test-contact@example.com
app.mail.from=export_system <test@example.com>

# Don't auto-run documentImportJob on context startup (H2 is embedded, so Batch's
# metadata schema still initializes automatically here).
spring.batch.job.enabled=false

# Write test-run uploads under target/, not the project root, so they're cleaned by
# `mvn clean` instead of accumulating in the working tree.
app.storage.upload-dir=target/test-uploads/trade-documents
app.storage.import-staging-dir=target/test-uploads/import-staging
